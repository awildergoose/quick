# heavily modified version of
# https://github.com/richardsondev/rustapplicationtemplate
name: CI

on:
  push:
    branches:
      - master
  release:
    types: [released]
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build and Release
    permissions:
      contents: write
    env:
      APP_NAME: quick
    strategy:
      matrix:
        target:
          - { displayName: 32-bit Windows, rustTarget: i686-pc-windows-gnu }
          - { displayName: 64-bit Windows, rustTarget: x86_64-pc-windows-gnu }

          - { displayName: 32-bit Linux, rustTarget: i686-unknown-linux-gnu }
          - { displayName: 64-bit Linux, rustTarget: x86_64-unknown-linux-gnu }
          - {
              displayName: ARM32 ARMv6 Linux,
              rustTarget: arm-unknown-linux-gnueabi,
            }
          - {
              displayName: ARM32 ARMv7 Linux,
              rustTarget: armv7-unknown-linux-gnueabihf,
            }
          - { displayName: ARM64 Linux, rustTarget: aarch64-unknown-linux-gnu }

          - { displayName: 64-bit macOS, rustTarget: x86_64-apple-darwin }

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Rust targets
        run: rustup target add ${{ matrix.target.rustTarget }}

      - name: Install cross
        run: cargo install cross

      - name: Build
        run: cross build --release --target ${{ matrix.target.rustTarget }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.target.rustTarget }}${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }}
          path: ./target/${{ matrix.target.rustTarget }}/release/${{ env.APP_NAME }}${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }}

      - name: Upload Release Asset
        if: github.event_name == 'release'
        id: upload-release-asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ./target/${{ matrix.target.rustTarget }}/release/${{ env.APP_NAME }}${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }} ./${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.target.rustTarget }}${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }} &&
          gh release upload ${{ github.event.release.tag_name }} ./${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.target.rustTarget }}${{ endsWith(matrix.target.rustTarget, '-windows-gnu') && '.exe' || '' }}#"${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.target.rustTarget }} (${{ matrix.target.displayName }})"
